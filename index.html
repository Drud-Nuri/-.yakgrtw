<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>یەکگرتووی ئیسلامی کوردستان</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Kufi Arabic',system-ui,sans-serif;
  background-color:#2b1710;
  background-image:
    radial-gradient(130% 90% at 50% -20%, rgba(214,158,84,.45) 0%, rgba(214,158,84,0) 50%),
    radial-gradient(80% 55% at 85% 15%, rgba(168,110,50,.22) 0%, rgba(168,110,50,0) 60%),
    radial-gradient(90% 65% at 50% 120%, rgba(10,4,2,.9) 0%, rgba(10,4,2,0) 65%),
    linear-gradient(165deg, #6b4222 0%, #4a2a14 35%, #331608 70%, #1f0c05 100%);
  color:#f7ecd9;
  height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px 20px;
  position:relative;
  overflow:hidden;
}
body::after{
  content:"";
  position:fixed;inset:0;
  box-shadow:inset 0 0 130px rgba(0,0,0,.5);
  pointer-events:none;
}
main{max-width:320px;width:100%;text-align:center;position:relative}

.logowrap{position:relative;z-index:1;margin-bottom:10px}
img.logo{width:200%;max-width:200px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}

p.subtitle{
  position:relative;z-index:1;
  font-size:12px;font-weight:600;letter-spacing:.2px;
  color:#f3d9ae;margin-top:4px;
}

.rule{
  width:32px;height:1px;background:rgba(217,164,65,.4);
  margin:18px auto 20px;position:relative;z-index:1;
}

ul{list-style:none;position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}

a{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:10px 16px;color:#fffaf0;text-decoration:none;
  font-size:13.5px;font-weight:600;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  border:1px solid rgba(217,164,65,.4);
  border-radius:999px;
  box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .25s ease,box-shadow .25s ease,background .25s ease;
}
a:hover{
  transform:translateY(-2px);
  border-color:rgba(217,164,65,.75);
  box-shadow:0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.16);
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));
}
a:active{transform:scale(.97) translateY(0);box-shadow:0 3px 10px rgba(0,0,0,.3)}

b{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.18),0 0 0 0 rgba(217,164,65,0);
  transition:box-shadow .3s ease,transform .3s ease;
}
b svg{width:14px;height:14px;fill:#fff}
a:hover b{
  box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.18),0 0 0 4px rgba(217,164,65,.35);
  transform:scale(1.06);
}

.labelgroup{display:flex;flex-direction:column;gap:2px;line-height:1.15;align-items:center;text-align:center}
.labelgroup .kurd{font-size:14px;font-weight:700}
.labelgroup .eng{font-size:9.5px;font-weight:400;color:#e0c39e;letter-spacing:.4px}

footer{
  position:relative;z-index:1;
  margin-top:22px;
  font-size:10px;
  color:#9a7a56;
  letter-spacing:.3px;
}
</style>
</head>
<body>

  <div class="logowrap"><img class="logo" src="یەکگرتوو.jpg" alt="لۆگۆ"></div>
  <p class="subtitle">لە دوانگەکەنی ئێمەوە، ڕاستیەکان باشتر دەبینیت.</p>
